# Dedicated staging hosts. Existing /tari/ and /near/ asset/API paths remain
# supported so wallet callbacks and the original staging URLs keep working.
# Install only after the verified Nginx/TLS before-image capture.
server {
    listen 80;
    server_name tari.staging.arkimals-game.com near.staging.arkimals-game.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/arkimals-acme; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name tari.staging.arkimals-game.com;
    ssl_certificate /etc/letsencrypt/live/arkimals-staging-games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkimals-staging-games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location = /tari { return 308 /tari/; }
    location ^~ /tari/ {
        proxy_pass http://127.0.0.1:18787/;
        include /etc/nginx/snippets/arkimals-staging-game-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:18787;
        include /etc/nginx/snippets/arkimals-staging-game-proxy.conf;
    }
}

server {
    listen 443 ssl;
    server_name near.staging.arkimals-game.com;
    ssl_certificate /etc/letsencrypt/live/arkimals-staging-games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arkimals-staging-games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location = /near { return 308 /near/; }
    location / {
        proxy_pass http://127.0.0.1:18788;
        include /etc/nginx/snippets/arkimals-staging-game-proxy.conf;
    }
}
