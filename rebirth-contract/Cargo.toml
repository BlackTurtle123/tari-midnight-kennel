[package]
name = "arkimals_rebirth"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tari_template_lib = "0.34"
minicbor = { version = "2.3", features = ["derive", "std"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
tari_template_test_tooling = "0.46"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
